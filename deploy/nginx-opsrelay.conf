# OpsRelay — Nginx config for EC2 (HTTP + HTTPS template)
# APP_ROOT is replaced by deploy/setup-nginx.sh with your project path
# DOMAIN and SSL paths are replaced when enabling HTTPS (see docs/EC2_DEPLOY.md)

# Redirect HTTP to HTTPS when SSL is configured (uncomment after certbot):
# server {
#     listen 80;
#     listen [::]:80;
#     server_name __DOMAIN__;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root __APP_ROOT__/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}

